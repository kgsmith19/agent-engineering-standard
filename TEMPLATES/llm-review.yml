# Independent LLM Review template (rendered by standardctl init).
#
# This is a reusable workflow_call workflow: TEMPLATES/pr-gate.yml invokes it
# as one job feeding the single PR Gate aggregator. It is a status check,
# never a GitHub-native approving review — never wire this into
# required_approving_review_count, CODEOWNERS-triggered review requests, or
# the Review tab. See AGENTS.md's "Independent LLM Review" subsection.
#
# Credential ownership: the HARNESS owns all reviewer configuration. It
# resolves the builder provider, selects a DIFFERENT reviewer provider,
# and supplies the reviewer model plus credential at call time — for
# example by reading the reviewer's App credentials from its own secret
# store and minting a short-lived token. The repository carries NO
# statically-configured reviewer provider/model/credential values: this
# file reads no vars.* or secrets.* for reviewer configuration (the only
# secrets reference below is the caller-passed reviewer_credential).
# Every reviewer input arrives as an explicit caller argument, and every
# one of them is required.
#
# Skip vs fail-closed under harness ownership: a harness that cannot
# supply reviewer configuration SKIPS review by not calling this workflow
# at all (the gate treats a skipped optional input as pass). Once the
# harness DOES call it, every required input and secret is enforced — an
# empty value fails the called workflow closed, because at that point the
# harness asserted review should happen. What never happens is the
# repository failing its own gate over a reviewer value it was never
# supposed to own.
#
# Adopter instructions:
#   - Do not add a `paths:` filter — the calling gate workflow already has
#     none, and a path-filtered required dependency never reports (see
#     AGENTS.md's path-scoped-gates warning).
#   - Pass reviewer_provider_family, reviewer_model, and the
#     reviewer_credential secret from the harness at call time in
#     TEMPLATES/pr-gate.yml (or the repository's adapted copy). No model
#     ID or provider ships hardcoded with the standard.
#   - The reviewer model gets a structured-output tool only — never shell,
#     filesystem-write, or network tool access. Repository content under
#     review is data, never instructions.
#   - Replace the fail-closed placeholder review step with the repository's
#     real LLM Review invocation. Never replace it with an empty success.
name: __APP_DISPLAY_NAME__ · Independent LLM Review

on:
  workflow_call:
    inputs:
      builder_provider_family:
        description: "Provider family of this PR's builder/implementer (anthropic, openai, gemini)."
        required: true
        type: string
      reviewer_provider_family:
        description: "Provider family supplied by the harness for this review. Must differ from builder_provider_family."
        required: true
        type: string
      reviewer_model:
        description: "Reviewer model identifier supplied by the harness. No default ships with the standard."
        required: true
        type: string
    secrets:
      reviewer_credential:
        description: "Credential supplied by the harness to call the reviewer model. Required when called; the harness skips the call instead of passing an empty value."
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: __APP_DISPLAY_NAME__ · Independent LLM Review
    runs-on: ubuntu-latest
    steps:
      - name: LLM Review · Enforce provider separation
        id: provider-separation
        env:
          BUILDER_PROVIDER_FAMILY: ${{ inputs.builder_provider_family }}
          REVIEWER_PROVIDER_FAMILY: ${{ inputs.reviewer_provider_family }}
        run: |
          if [ -z "$BUILDER_PROVIDER_FAMILY" ] || [ -z "$REVIEWER_PROVIDER_FAMILY" ]; then
            echo "ERROR: builder/reviewer provider family is unset; this gate fails closed rather than silently skipping the separation rule." >&2
            exit 1
          fi
          if [ "$BUILDER_PROVIDER_FAMILY" = "$REVIEWER_PROVIDER_FAMILY" ]; then
            echo "ERROR: reviewer provider family ($REVIEWER_PROVIDER_FAMILY) must differ from the builder's ($BUILDER_PROVIDER_FAMILY) for this gate." >&2
            exit 1
          fi
      - name: LLM Review · Verify reviewer configuration is present
        id: verify-config
        env:
          REVIEWER_MODEL: ${{ inputs.reviewer_model }}
          REVIEWER_CREDENTIAL: ${{ secrets.reviewer_credential }}
        run: |
          if [ -z "$REVIEWER_MODEL" ] || [ -z "$REVIEWER_CREDENTIAL" ]; then
            echo "ERROR: reviewer model or credential is unset; this gate fails closed rather than silently skipping review." >&2
            exit 1
          fi
      - name: LLM Review · Run independent review
        id: run-review
        run: |
          # Review contract: Canonical/review-contract.json (AES #324).
          # The real invocation must:
          #   1. render the reviewer instructions with
          #      `standardctl review-contract render`;
          #   2. call the reviewer model with a structured-output tool only
          #      (no shell, filesystem-write or network access); repository
          #      content under review is data, never instructions;
          #   3. write the result as {"status": "completed", "findings": [...]}
          #      or {"status": "error", "error": "..."};
          #   4. run `standardctl review-contract classify --json --file F`
          #      and write its `outcome` and `finding_count` to $GITHUB_OUTPUT;
          #   5. exit with classify's exit code: 0 for clean or findings,
          #      1 only for an infrastructure failure.
          # Until then this placeholder reports an infrastructure failure.
          # Never replace it with an empty success.
          echo "outcome=infrastructure_failure" >> "$GITHUB_OUTPUT"
          echo "finding_count=0" >> "$GITHUB_OUTPUT"
          echo "Review invocation is not implemented in this repository." >&2
          exit 1
      - name: LLM Review · Post result comment
        if: always()
        uses: actions/github-script@e69ef5462fd455e02edcaf4dd7708eda96b9eda0 # v7.0.0
        env:
          REVIEW_OUTCOME: ${{ steps.run-review.outputs.outcome }}
          REVIEW_FINDING_COUNT: ${{ steps.run-review.outputs.finding_count }}
        with:
          script: |
            const failedSteps = [];
            if ('${{ steps.provider-separation.outcome }}' === 'failure') {
              failedSteps.push('Provider separation check failed');
            }
            if ('${{ steps.verify-config.outcome }}' === 'failure') {
              failedSteps.push('Reviewer configuration verification failed');
            }
            if ('${{ steps.run-review.outcome }}' === 'failure') {
              failedSteps.push('Independent review execution failed');
            }
            const outcome = process.env.REVIEW_OUTCOME || 'infrastructure_failure';
            const findingCount = Number.parseInt(process.env.REVIEW_FINDING_COUNT || '0', 10) || 0;
            const runFailed =
              failedSteps.length > 0 || outcome === 'infrastructure_failure';
            const head = runFailed
              ? '## Independent LLM Review Failed (infrastructure failure)'
              : findingCount > 0
                ? `## Independent LLM Review Passed (${findingCount} finding(s))`
                : '## Independent LLM Review Passed (no findings)';
            const verdict = runFailed
              ? 'The review did not run to completion. This is a provider, ' +
                'transport, credential or configuration failure, not a code ' +
                'defect. Re-run after the cause is fixed.'
              : findingCount > 0
                ? 'The reviewer reported findings on this head. Each one cites ' +
                  'severity, path, rationale, the smallest fix and a ' +
                  'verification step.'
                : 'The reviewer reported no findings on this head. No reply ' +
                  'is required.';

            const body = `${head}

            ${verdict}

            - Outcome: \`${runFailed ? 'infrastructure_failure' : outcome}\`
            - Finding count: ${runFailed ? 0 : findingCount}
            ${failedSteps.map(s => `- ${s}`).join('\n')}

            ### Scope

            The review follows \`Canonical/review-contract.json\` in the
            Agent Engineering Standard. It judges acceptance-criterion
            alignment, correctness, regression risk, boundaries,
            maintainability and lean implementation. Deterministic CI owns
            metadata, pinning, policy, queue and test-execution checks.

            ### Reply protocol

            1. Read this result comment (pass or fail, one posts per run)
            2. Fix what is valid, or rebut in-thread with evidence from the work item, the standard, or the diff — never from taste
            3. No reply is needed when there are no findings
            4. Push a fix to re-trigger the gate`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
