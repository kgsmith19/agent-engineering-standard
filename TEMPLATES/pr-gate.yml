# Application-specific PR Gate template (rendered by standardctl init).
#
# Adopter instructions:
#   - Keep only the stage jobs that apply to this repository. When you
#     delete a job, also delete it from the final gate job's "needs"
#     list AND from its EXPECTED_JOBS value — the gate fails closed on
#     any mismatch, and "standardctl verify" statically enforces that
#     the needs list matches the defined jobs.
#   - Replace every fail-closed placeholder (echo + exit 1) with the
#     repository's real command. Never replace one with an empty
#     success — inapplicable stages are deleted, not stubbed.
#   - The final job name is the repository's sole required status check.
name: __APP_DISPLAY_NAME__ PR Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - labeled
      - unlabeled
  push:
    branches:
      - __DEFAULT_BRANCH__
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  policy:
    name: __APP_DISPLAY_NAME__ · Policy & Structure
    runs-on: ubuntu-latest
    steps:
      - name: Policy · Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Structure · Validate repository layout
        run: |
          echo "Replace this placeholder with the repository's structural"
          echo "and policy validation command, or delete this job and its"
          echo "needs/EXPECTED_JOBS entries."
          exit 1

  lint:
    name: __APP_DISPLAY_NAME__ · Lint & Lean
    runs-on: ubuntu-latest
    steps:
      - name: Lean · Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Quality · Check whitespace
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD --
      - name: Quality · Run formatter and linters
        run: |
          echo "Replace this placeholder with the repository's formatter"
          echo "and lint commands."
          exit 1

  security:
    name: __APP_DISPLAY_NAME__ · Security
    runs-on: ubuntu-latest
    steps:
      - name: Security · Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Security · Run security checks
        run: |
          echo "Replace this placeholder with the repository's security"
          echo "analysis and secret-scan commands."
          exit 1

  unit:
    name: __APP_DISPLAY_NAME__ · Unit & Component
    runs-on: ubuntu-latest
    steps:
      - name: Test · Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test · Run unit and component tests
        run: |
          echo "Replace this placeholder with the repository's unit and"
          echo "component test command."
          exit 1

  integration:
    name: __APP_DISPLAY_NAME__ · Integration & Contract
    runs-on: ubuntu-latest
    steps:
      - name: Test · Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test · Run integration and contract tests
        run: |
          echo "Replace this placeholder with the repository's integration"
          echo "and contract test command, or delete this job."
          exit 1

  property:
    name: __APP_DISPLAY_NAME__ · Property & State
    runs-on: ubuntu-latest
    steps:
      - name: Test · Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test · Run property and state tests
        run: |
          echo "Replace this placeholder with the repository's property and"
