  mutation:
    name: __APP_DISPLAY_NAME__ · Mutation
    runs-on: ubuntu-latest
    steps:
      - name: Test · Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test · Run targeted mutation tests
        run: |
          echo "Replace this placeholder with the repository's targeted"
