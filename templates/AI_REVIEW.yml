name: AI Review Gate

on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited]

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  update-ai-review:
    if: >-
      ((github.event_name != 'pull_request_review' && github.event_name != 'pull_request_review_comment') || github.event.pull_request.draft == false) &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: kgsmith19/agent-engineering-standard/.github/workflows/ai-review-reusable.yml@__STANDARD_SHA__
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
      standard_sha: __STANDARD_SHA__
