name: "PR Gate"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: "PR Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: "Gate: Ready-at-Creation Policy"
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        shell: bash
        run: |
          echo '::error::Ready-at-creation policy violation. Create PRs with draft:false; gh callers must omit --draft.'
          exit 1
      # Replace this bootstrap step with the repository's real stack-specific
      # deterministic evidence (build/test/lint), keeping the workflow and job
      # names exactly "PR Gate".
      - name: "Gate: Bootstrap Control Files"
        shell: bash
        run: |
          test -s AGENTS.md
          test -s PRD.md
          test -s .agent/standard.lock
          test -s .agent/project.yaml
          if grep -Eq '^  gate_profile: bootstrap-only$' .agent/project.yaml; then
            PRODUCT_FILES=$(git ls-files | grep -Ev '^(AGENTS\.md|CLAUDE\.md|PRD\.md|README\.md|LICENSE|\.gitignore|\.agent/|\.github/|docs/|specs/)$' || true)
            if [ -n "$PRODUCT_FILES" ]; then
              echo '::error::Product files exist while the gate is still bootstrap-only. Configure the real stack-specific objective gate first.'
              printf '%s\n' "$PRODUCT_FILES"
              exit 1
            fi
          fi
