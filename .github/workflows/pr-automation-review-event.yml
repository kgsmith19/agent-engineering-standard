name: PR Automation Review Event

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

# One repo-wide non-canceling authority lock shared by evaluator and orchestrator; GitHub keeps only the newest pending run per group and the six-hourly watchdog is the convergence net.
concurrency:
  group: automation-authority-${{ github.repository }}
  cancel-in-progress: false

jobs:
  review-event:
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/pr-automation-reusable.yml
    with:
      mode: review-event
      pr_number: ${{ github.event.pull_request.number }}
      # Review events expose a PR merge SHA in github.sha. The orchestrator
      # must execute from trusted base code when governing this control plane.
      standard_sha: ${{ github.event.pull_request.base.sha }}
    secrets:
      automation_token: ${{ secrets.AUTOMATION_TOKEN }}
