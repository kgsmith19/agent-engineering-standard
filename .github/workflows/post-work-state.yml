name: Post Work State

# Called by merge-policy and pr-gate workflows to post Work State comments
# via the dev-agent identity rather than the repository token.
#
# The comment body arrives as a workflow_dispatch input carrying newlines,
# backticks, and other markdown. It is passed into github-script via an
# environment variable (process.env.WORK_STATE_BODY) rather than string
# interpolation so no shell or JS string-literal escaping can corrupt it.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
      issue_number:
        description: "Linked issue number (optional)"
        required: false
      body:
        description: "Work State comment body"
        required: true

permissions:
  issues: write
  pull-requests: write

jobs:
  post:
    name: Post Work State
    runs-on: ubuntu-latest
    steps:
      - name: Create dev-agent token
        uses: getsentry/action-github-app-token@v3
        id: app_token
        with:
          app_id: ${{ secrets.DEV_GITHUB_APP_ID }}
          private_key: ${{ secrets.DEV_GITHUB_APP_PRIVATE_KEY }}

      - name: Post Work State to PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          WORK_STATE_BODY: ${{ github.event.inputs.body }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const marker = '<!-- agent-engineering-standard:work-state:v1 -->';
            const metadata = `<!-- agent-metadata:dev-agent:${context.eventName}:${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} -->`;
            const body = metadata + '\n' + process.env.WORK_STATE_BODY;
            const issue_number = parseInt(process.env.PR_NUMBER, 10);
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated Work State comment ${existing.id} on PR #${issue_number}`);
            } else {
              const { data: comment } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`Created Work State comment ${comment.id} on PR #${issue_number}`);
            }

      - name: Post Work State to linked Issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        if: github.event.inputs.issue_number != ''
        env:
          WORK_STATE_BODY: ${{ github.event.inputs.body }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const marker = '<!-- agent-engineering-standard:work-state:v1 -->';
            const metadata = `<!-- agent-metadata:dev-agent:${context.eventName}:${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} -->`;
            const body = metadata + '\n' + process.env.WORK_STATE_BODY;
            const issue_number = parseInt(process.env.ISSUE_NUMBER, 10);
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated Work State comment ${existing.id} on issue #${issue_number}`);
            } else {
              const { data: comment } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`Created Work State comment ${comment.id} on issue #${issue_number}`);
            }
