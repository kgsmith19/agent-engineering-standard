name: Post Work State

# Called by merge-policy and pr-gate workflows to post Work State comments
# via the dev-agent identity rather than the repository token

env:
  DEV_AGENT_MODEL: anthropic/claude-sonnet-4-5

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
      issue_number:
        description: "Linked issue number (optional)"
        required: false
      body:
        description: "Work State comment body"
        required: true

permissions:
  issues: write
  pull-requests: write

jobs:
  post:
    name: Post Work State
    runs-on: ubuntu-latest
    steps:
      - name: Create dev-agent token
        uses: getsentry/action-github-app-token@v3
        id: app_token
        with:
          app_id: ${{ secrets.DEV_GITHUB_APP_ID }}
          private_key: ${{ secrets.DEV_GITHUB_APP_PRIVATE_KEY }}

       - name: Post Work State to PR
         uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
         with:
           github-token: ${{ steps.app_token.outputs.token }}
           script: |
             const prNumber = parseInt('${{ github.event.inputs.pr_number }}');
             const rawBody = JSON.parse('${{ toJSON(github.event.inputs.body) }}');

             // Prepend agent metadata
             const metadata = `<!-- agent-metadata:dev:${{ env.DEV_AGENT_MODEL }}:${{ github.event.name }}:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} -->`;
             const body = metadata + '\n' + rawBody;

            // Find existing Work State comment by marker
            const marker = '<!-- agent-engineering-standard:work-state:v1 -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').startsWith(marker));

            if (existing) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
              core.info(`Updated Work State comment ${existing.id}`);
            } else {
              // Create new comment
              const { data: comment } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
              core.info(`Created Work State comment ${comment.id}`);
            }

       - name: Post Work State to linked Issue
         uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
         if: github.event.inputs.issue_number != ''
         with:
           github-token: ${{ steps.app_token.outputs.token }}
           script: |
             const issueNumber = parseInt('${{ github.event.inputs.issue_number }}');
             const rawBody = JSON.parse('${{ toJSON(github.event.inputs.body) }}');

             // Prepend agent metadata
             const metadata = `<!-- agent-metadata:dev:${{ env.DEV_AGENT_MODEL }}:${{ github.event.name }}:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} -->`;
             const body = metadata + '\n' + rawBody;

            // Find existing Work State comment by marker
            const marker = '<!-- agent-engineering-standard:work-state:v1 -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').startsWith(marker));

            if (existing) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
              core.info(`Updated Work State comment ${existing.id} on issue #${issueNumber}`);
            } else {
              // Create new comment
              const { data: comment } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });
              core.info(`Created Work State comment ${comment.id} on issue #${issueNumber}`);
            }
