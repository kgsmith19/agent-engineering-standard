name: Reviewer Agent Post v2

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action (post_comment, add_label, remove_label)"
        required: true
        type: choice
        options:
          - post_comment
          - add_label
          - remove_label
      pr_number:
        description: "Pull request number"
        required: true
      body:
        description: "Comment body"
        required: false
      labels:
        description: "Labels (comma-separated or single name to remove)"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  post:
    name: Post Review
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        uses: getsentry/action-github-app-token@38a3ce582e5b6522b21c3f5e9e13a18fbf0e659a # v3.0.0
        id: app_token
        with:
          app_id: ${{ secrets.REVIEW_GITHUB_APP_ID }}
          private_key: ${{ secrets.REVIEW_GITHUB_APP_PRIVATE_KEY }}

      - name: Post review comment via app
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        if: github.event.inputs.action == 'post_comment'
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ github.event.inputs.pr_number }}'),
              body: '${{ github.event.inputs.body }}'
            });
            core.info('Review comment posted');

      - name: Add labels via app
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        if: github.event.inputs.action == 'add_label'
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const labels = '${{ github.event.inputs.labels }}'.split(',').map(l => l.trim());
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ github.event.inputs.pr_number }}'),
              labels: labels
            });
            core.info(`Added ${labels.length} labels`);

      - name: Remove label via app
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        if: github.event.inputs.action == 'remove_label'
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ github.event.inputs.pr_number }}'),
              name: '${{ github.event.inputs.labels }}'
            });
            core.info('Label removed');
