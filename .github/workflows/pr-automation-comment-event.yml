name: PR Automation Comment Event

on:
  issue_comment:
    types: [created, edited, deleted]

# One repo-wide non-canceling authority lock shared by evaluator and orchestrator; GitHub keeps only the newest pending run per group and the six-hourly watchdog is the convergence net.
concurrency:
  group: automation-authority-${{ github.repository }}
  cancel-in-progress: false

jobs:
  comment-event:
    if: >-
      github.event.issue.pull_request != null &&
      (github.event.comment.user.login == 'Copilot' || github.event.comment.user.login == 'copilot-pull-request-reviewer[bot]' || github.event.comment.user.login == 'copilot-swe-agent[bot]') &&
      (contains(github.event.comment.body, 'AI-REVIEW PASS') || contains(github.event.comment.body, 'AI-REVIEW FAIL'))
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/pr-automation-reusable.yml
    with:
      mode: comment-event
      pr_number: ${{ github.event.issue.number }}
      standard_sha: ${{ github.sha }}
    secrets:
      automation_token: ${{ secrets.AUTOMATION_TOKEN }}
