name: Reusable AI Review Gate

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      standard_sha:
        required: true
        type: string

jobs:
  evaluate:
    name: Update AI Review status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kgsmith19/agent-engineering-standard
          ref: ${{ inputs.standard_sha }}
          path: .standard
      - name: Evaluate exact-head machine review
        shell: pwsh
        run: |
          & pwsh -NoProfile -File .standard/scripts/evaluate-ai-review.ps1 `
            -Repo '${{ github.repository }}' `
            -Pr ${{ inputs.pr_number }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Request bounded repair for material findings
        shell: pwsh
        run: |
          & pwsh -NoProfile -File .standard/scripts/request-review-repair.ps1 `
            -Repo '${{ github.repository }}' `
            -Pr ${{ inputs.pr_number }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reconcile stale machine-only review threads
        shell: pwsh
        run: |
          & pwsh -NoProfile -File .standard/scripts/reconcile-machine-review-threads.ps1 `
            -Repo '${{ github.repository }}' `
            -Pr ${{ inputs.pr_number }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
