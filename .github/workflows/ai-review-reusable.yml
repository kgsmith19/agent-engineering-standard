name: "Advisory: AI Review (Reusable)"

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      standard_sha:
        required: true
        type: string

jobs:
  evaluate:
    name: Update AI Review status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kgsmith19/agent-engineering-standard
          ref: ${{ inputs.standard_sha }}
          path: .standard
      - name: Detect trusted evaluator
        id: trusted_standard
        shell: bash
        run: |
          if [[ -f .standard/scripts/evaluate-ai-review.ps1 && -f .standard/scripts/request-review-repair.ps1 && -f .standard/scripts/reconcile-machine-review-threads.ps1 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Trusted evaluator unavailable::The trusted standard SHA predates the evaluator. This bootstrap control-plane PR remains fail-closed and requires the documented external authority path."
            echo "### Trusted evaluator unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "No proposed PR script was executed. Use the documented external authority path for this bootstrap control-plane PR." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Evaluate exact-head machine review
        if: steps.trusted_standard.outputs.available == 'true'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File .standard/scripts/evaluate-ai-review.ps1 `
            -Repo '${{ github.repository }}' `
            -Pr ${{ inputs.pr_number }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Request bounded repair for material findings
        if: steps.trusted_standard.outputs.available == 'true'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File .standard/scripts/request-review-repair.ps1 `
            -Repo '${{ github.repository }}' `
            -Pr ${{ inputs.pr_number }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reconcile stale machine-only review threads
        if: steps.trusted_standard.outputs.available == 'true'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File .standard/scripts/reconcile-machine-review-threads.ps1 `
            -Repo '${{ github.repository }}' `
            -Pr ${{ inputs.pr_number }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
