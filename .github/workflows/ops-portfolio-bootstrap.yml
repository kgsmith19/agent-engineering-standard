name: "Ops: Portfolio Bootstrap"

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ops-portfolio-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: "Ops: Portfolio Bootstrap"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
      GH_TOKEN_ADMIN: ${{ secrets.AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # This lane WRITES live settings, labels, and rulesets. Running it on the
      # default GITHUB_TOKEN would silently no-op or half-apply; fail closed.
      - name: "Ops: Require the dedicated automation identity"
        shell: bash
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo '::error::AUTOMATION-IDENTITY-MISSING: secrets.AUTOMATION_TOKEN is not provisioned; portfolio bootstrap refuses to run on the workflow token.'
            exit 1
          fi
      - name: "Ops: Apply portfolio settings and verify remotely"
        shell: pwsh
        run: ./scripts/setup-portfolio.ps1
      - name: "Ops: Remote doctor"
        shell: pwsh
        run: ./scripts/doctor.ps1 -Remote
