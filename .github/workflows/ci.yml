name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test legacy branch-protection logic
        shell: pwsh
        run: ./tests/legacy-protection.tests.ps1
      - name: Test standard-lock upgrade logic
        shell: pwsh
        run: ./tests/standard-lock.tests.ps1
      - name: Test independent review policy
        shell: pwsh
        run: ./tests/review-policy.tests.ps1
      - name: Validate standard
        shell: pwsh
        run: ./scripts/doctor.ps1
