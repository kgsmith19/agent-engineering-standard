name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Enforce Ready at creation
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        shell: bash
        run: |
          echo '::error::Ready-at-creation policy violation. Create PRs with draft:false; gh callers must omit --draft.'
          exit 1
      - name: Test legacy branch-protection logic
        shell: pwsh
        run: ./tests/legacy-protection.tests.ps1
      - name: Test standard-lock upgrades
        shell: pwsh
        run: ./tests/standard-lock.tests.ps1
      - name: Test machine review policy
        shell: pwsh
        run: ./tests/review-policy.tests.ps1
      - name: Test ready-at-creation enforcement
        shell: pwsh
        run: ./tests/draft-prevention.tests.ps1
      - name: Lint PR creation contract
        shell: pwsh
        run: ./scripts/lint-pr-creation.ps1
      - name: Test standard hygiene
        shell: pwsh
        run: ./tests/standard-hygiene.tests.ps1
      - name: Test state-machine exhaustiveness
        shell: pwsh
        run: ./tests/state-machine-exhaustiveness.tests.ps1
      - name: Validate standard
        shell: pwsh
        run: ./scripts/doctor.ps1
