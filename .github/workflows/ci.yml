name: "Gate: Deterministic CI"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: "Gate: Deterministic CI"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: "Gate: Ready-at-Creation Policy"
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        shell: bash
        run: |
          echo '::error::Ready-at-creation policy violation. Create PRs with draft:false; gh callers must omit --draft.'
          exit 1
      - name: "Gate: Legacy Branch-Protection Tests"
        shell: pwsh
        run: ./tests/legacy-protection.tests.ps1
      - name: "Gate: Standard-Lock Tests"
        shell: pwsh
        run: ./tests/standard-lock.tests.ps1
      - name: "Gate: Review Policy Tests"
        shell: pwsh
        run: ./tests/review-policy.tests.ps1
      - name: "Gate: Ready-at-Creation Tests"
        shell: pwsh
        run: ./tests/draft-prevention.tests.ps1
      - name: "Gate: Unconditional Advisory Evaluation Tests"
        shell: pwsh
        run: ./tests/unconditional-evaluation.tests.ps1
      - name: "Gate: Script Smoke Tests"
        shell: pwsh
        run: ./tests/script-smoke.tests.ps1
      - name: "Gate: Automation Entrypoint Tests"
        shell: pwsh
        run: ./tests/automation-entrypoints.tests.ps1
      - name: "Gate: One-Pass Arming Test"
        shell: pwsh
        run: ./tests/gate-result-arming.tests.ps1
      - name: "Audit: PR Creation Lint"
        shell: pwsh
        run: ./scripts/lint-pr-creation.ps1
      - name: "Gate: Standard Hygiene Tests"
        shell: pwsh
        run: ./tests/standard-hygiene.tests.ps1
      - name: "Gate: State-Machine Exhaustiveness Tests"
        shell: pwsh
        run: ./tests/state-machine-exhaustiveness.tests.ps1
      - name: "Gate: Standard Validation (doctor)"
        shell: pwsh
        run: ./scripts/doctor.ps1

  # Transitional bridge: exists only until the owner flips the ruleset's required
  # context from 'PR Gate' to 'Gate: Deterministic CI'. Fail-closed by design —
  # a gate failure skips this job, the required 'PR Gate' context goes missing,
  # and the merge stays blocked.
  pr-gate-bridge:
    name: PR Gate
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: exit 0
