name: PR Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s AGENTS.md
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD --
